name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # A couple of minutes on a good day. The cap is against a hung step, not
    # a target.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not `latest`: a CI run should be reproducible against the
          # Bun the code was written under. Bump it on purpose, in a commit
          # that says so, when the local toolchain moves.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # The browser suite, in a job of its own.
  #
  # Separate rather than four more lines on the job above, and the split is
  # the point: the checks up there are seconds and gate everything, and this
  # one drives forty-odd scenario files — a hundred and thirty-some browser
  # scenarios between them — and takes minutes. Failing fast on a type error
  # should not wait behind a harbour being generated.
  #
  # It earns the minutes. The unit suite is fifteen hundred tests and every
  # one of them passed on a build that could not boot — `PagedPanel` asks its
  # subclass for a deck from inside its own constructor, which no test that
  # never constructs a scene can reach. This is the only thing here that runs
  # the game.
  #
  # Not `continue-on-error`. A suite whose failures are advisory is a suite
  # nobody reads.
  scenarios:
    runs-on: ubuntu-latest
    # Twenty on a good day; the cap is there so a hung browser cannot burn an
    # hour of the runner rather than as a target.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not `latest`: a CI run should be reproducible against the
          # Bun the code was written under. Bump it on purpose, in a commit
          # that says so, when the local toolchain moves.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The browser is cached between runs, keyed on the Playwright that was
      # actually installed — read from node_modules rather than the range in
      # package.json, because `^1.63.0` stays the same string while the
      # lockfile moves to a build that wants a different Chromium. The
      # install step below still runs on a hit: `--with-deps` puts the OS
      # libraries in, which no cache under the home directory carries, and
      # Playwright itself does nothing when the browser is already there.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(bun -p 'require("./node_modules/playwright/package.json").version')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Chromium only. The scenarios launch it by name and nothing here has
      # ever been run against another engine, so pulling three browsers down
      # would be three times the download for two of them to sit idle.
      - name: Install the browser
        run: bunx playwright install --with-deps chromium

      - name: Scenarios
        run: bun run e2e
