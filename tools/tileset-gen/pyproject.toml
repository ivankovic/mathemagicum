[project]
name = "tileset-gen"
version = "0.1.0"
description = "Procedural pixel-art tileset generator for Mathemagicum"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
authors = [
    { name = "Marko Ivankovic", email = "marko@ivankovic.me" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
]

[project.scripts]
tileset-gen = "tileset_gen:main"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
