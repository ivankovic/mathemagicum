<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mathemagicum</title>
    <!-- Root-absolute on purpose: Vite rewrites a leading slash with the
         build's base, so these come out relative in dist and the game stays
         hostable from a subdirectory. The manifest declares the same three
         icons; iOS reads none of it, which is what apple-touch-icon is for. -->
    <link rel="icon" type="image/png" href="/icon-64.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#000000" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        /* The canvas is sized to the viewport exactly; any overflow would
           mean a scrollbar that changes the viewport that sized it. */
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      /* Not a flex item. A canvas has an intrinsic aspect ratio from its
         width/height attributes, so a flex container stretching one axis
         makes the browser derive the other from that ratio -- which silently
         letterboxes the game after an orientation change instead of letting
         Phaser resize it. */
      #app > canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
