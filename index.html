<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `interactive-widget` asks the browser to shrink the *page* when the
         software keyboard comes up rather than to slide it about. Chrome
         honours it; Safari, as of writing, does not — which is why the CSS
         below has to prevent the sliding as well. Harmless where it is not
         understood, and one line where it is. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>Mathemagicum</title>
    <!-- Root-absolute on purpose: Vite rewrites a leading slash with the
         build's base, so these come out relative in dist and the game stays
         hostable from a subdirectory. The manifest declares the same three
         icons; iOS reads none of it, which is what apple-touch-icon is for. -->
    <link rel="icon" type="image/png" href="/icon-64.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#000000" />
    <!-- The one face the game is written in, fetched before anything asks
         for it. Root-absolute like the icons above, and `crossorigin`
         because a font preload is a CORS request whether or not it crosses
         an origin — without it the browser fetches the file twice, once for
         the preload it cannot use and once for the @font-face. -->
    <link rel="preload" href="/fonts/andika.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /*
         Andika, by SIL International, under the Open Font License. Drawn for
         people who are still learning to read, which is exactly who this is
         for: the letterforms are chosen to be unmistakable to somebody who
         does not yet know them well, and the zero is a plain round one
         rather than a slashed one — this game teaches a child what a nought
         looks like and must not then show them a second kind.

         Subset to Latin Extended-A, so Croatian and German are covered along
         with English, and served from this device. Nothing here is fetched
         from a font service: the game is played offline, and a face that
         arrived over the network would be a face that did not arrive.

         `swap` rather than `block`: if it somehow has not loaded, letters in
         the fallback are better than no letters. The scene waits for it
         before it draws anything anyway — see `BootScene`.
      */
      @font-face {
        font-family: "Andika";
        src: url("/fonts/andika.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        /* The canvas is sized to the viewport exactly; any overflow would
           mean a scrollbar that changes the viewport that sized it. */
        overflow: hidden;
      }
      /*
         Pinned, so the software keyboard cannot carry the game off screen.

         There is one HTML input in this game — the box a child types their
         name into — and on iPadOS focusing it made the whole screen slide up
         and out of sight. What happens is: Safari raises the keyboard, decides
         the input would be behind it, and scrolls the *layout* viewport to
         reveal it. Everything on the page is anchored to that viewport — the
         canvas in normal flow, and the input itself, which is `position:
         fixed` — so the whole game goes up with the scroll. `overflow: hidden`
         means nothing can ever scroll it back, so the page simply stays
         offset.

         Fixing the body takes the scroll away rather than correcting it after
         the fact: there is no layout scrolling to do, so Safari does none. The
         other half of the fix is in `PlayersScene` — the name box is laid out
         near the top of the screen, so there is nothing for the browser to
         want to reveal in the first place.

         `overflow: hidden` above is still doing its own job and is not a
         substitute for this: it stops the page being *scrollable*, and iOS
         scrolls it anyway. */
      body {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      /* Not a flex item. A canvas has an intrinsic aspect ratio from its
         width/height attributes, so a flex container stretching one axis
         makes the browser derive the other from that ratio -- which silently
         letterboxes the game after an orientation change instead of letting
         Phaser resize it. */
      #app > canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
