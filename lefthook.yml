pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js,jsx,json}"
      run: bunx biome check --no-errors-on-unmatched {staged_files}
    typecheck:
      glob: "*.{ts,tsx}"
      run: bunx tsc --noEmit
    python-lint:
      glob: "tools/tileset-gen/**/*.py"
      run: cd tools/tileset-gen && uv run ruff check . && uv run ruff format --check .
