version = 1
SPDX-PackageName = "mathemagicum"
SPDX-PackageSupplier = "Marko Ivankovic <marko@ivankovic.me>"
SPDX-PackageDownloadLocation = "https://github.com/ivankovic/mathemagicum"

# Source code: PolyForm-Noncommercial-1.0.0 (source-available, not OSI/FSF
# "open source" — noncommercial use only). See LICENSE for the Required
# Notice this license mandates be propagated with the software.
# Add per-file SPDX headers to new .ts/.tsx files:
#   SPDX-FileCopyrightText: <year> Marko Ivankovic
#   SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0

# Config/data files with no natural comment syntax for a header.
[[annotations]]
path = [
  "package.json",
  "bun.lock",
  "*.json",
  "*.svg",
]
SPDX-FileCopyrightText = "Marko Ivankovic"
SPDX-License-Identifier = "PolyForm-Noncommercial-1.0.0"

# Art, audio, and other binary assets are licensed separately from code.
# Assets that cannot carry a text header are declared here instead.
# Generated by the sibling asset-generator repo and committed here; see
# README's "Assets". This block comes AFTER the config-file one on purpose:
# the sprite sidecars and the atlas index are .json, and they describe the
# art rather than the program, so the later (winning) rule has to be the
# asset one or they would be claimed by the code license.
[[annotations]]
path = "public/assets/**"
SPDX-FileCopyrightText = "Marko Ivankovic"
SPDX-License-Identifier = "CC-BY-NC-ND-4.0"

# The app icon. Drawn by the same generator as everything above and licensed
# the same way, but it sits at the root of public/ rather than under assets/
# because it is not game art: the browser and the manifest fetch it by a
# fixed name next to index.html, and nothing in the game ever loads it.
[[annotations]]
path = "public/icon-*.png"
SPDX-FileCopyrightText = "Marko Ivankovic"
SPDX-License-Identifier = "CC-BY-NC-ND-4.0"
